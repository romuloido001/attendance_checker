<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learner Gate Pass</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#dde1e7;--pr:#1f6feb;--ok:#12805c;--no:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--tx:#e8eaed;--mu:#9aa3b0;--bd:#2c323b;--pr:#5b9dff;--ok:#3ecf9b;--no:#fb923c}}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:17px;margin:0}main{max-width:900px;margin:0 auto;padding:14px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
button,.btn{font:inherit;border:1px solid var(--pr);background:var(--pr);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:transparent;color:var(--pr)}button.d{background:transparent;border-color:var(--no);color:var(--no)}
nav button{background:transparent;color:var(--tx);border-color:var(--bd);white-space:nowrap}nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row input{flex:1;min-width:160px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600}
video{width:100%;max-height:300px;background:#000;border-radius:10px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;color:#fff}.IN{background:var(--ok)}.OUT{background:var(--no)}
.big{font-size:22px;font-weight:700}.mu{color:var(--mu);font-size:13px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal .card{text-align:center;max-width:320px;width:100%}#qr{display:flex;justify-content:center;background:#fff;padding:12px;border-radius:8px;margin:10px 0}
.err{color:var(--no);margin-top:8px}
</style></head><body>
<div id="app"></div>
<div id="modal"><div class="card"><div class="big" id="qn"></div><div id="qr"></div><div class="mu" id="qc"></div><div class="row" style="justify-content:center"><button onclick="$('modal').style.display='none'">Close</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const API_URL=''; // paste your Apps Script Web app URL here, or leave blank and paste it on the sign-in screen
let API=API_URL||localStorage.getItem('gp-api')||'',TOKEN=sessionStorage.getItem('gp-t')||'',busy=false;
let S={users:[],learners:[],logs:[],msgs:[]};
async function api(action,data={}){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:TOKEN,...data})});
  const j=await r.json();if(!j.ok){if(j.error==='auth'&&me)logout();throw new Error(j.error)}return j}
const RN={super:'Super Admin',admin:'Admin',teacher:'Teacher',gate:'Gate Keeper'};
const TABS={super:['scan','learners','accounts','logs','msgs'],admin:['scan','learners','accounts','logs','msgs'],teacher:['scan','learners','logs'],gate:['scan']};
const TN={scan:'Scan',learners:'Learners',accounts:'Accounts',logs:'Gate log',msgs:'Parent messages'};
const CREATE={super:['admin','teacher','gate'],admin:['teacher','gate']};
let me=null,tab='scan',editId=null,err='',q='',stream=null,lastC='',lastT=0;

function render(){
  if(!me){$('app').innerHTML=`<main style="max-width:380px;margin-top:40px"><div class="card"><h1>Learner Gate Pass</h1><p class="mu">Sign in to continue.</p>${API?'':'<label>Backend URL (Apps Script web app)</label><input id="lapi" placeholder="https://script.google.com/macros/s/.../exec">'}
  <label>Username</label><input id="lu" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password">
  <div class="err">${e(err)}</div><div class="row"><button onclick="login()">Sign in</button></div>
  </div></main>`;return}
  const t=TABS[me.role];
  $('app').innerHTML=`<header><h1>Gate Pass · ${e(RN[me.role])}</h1><div><span class="mu">${e(me.name)}</span> <button class="g" onclick="logout()">Sign out</button></div></header>
  <main>${t.length>1?'<nav>'+t.map(x=>`<button class="${x==tab?'on':''}" onclick="go('${x}')">${TN[x]}</button>`).join('')+'</nav>':''}<div id="v">${view()}</div></main>`;
}
function view(){return({scan:vScan,learners:vLearners,accounts:vAccounts,logs:vLogs,msgs:vMsgs})[tab]()}
async function go(t){stopCam();tab=t;editId=null;err='';render();
  const n={logs:['learners','logs'],msgs:['msgs'],accounts:['users'],learners:['learners']}[t]||[];
  if(n.length)try{const r=await Promise.all(n.map(k=>api('list_'+k)));n.forEach((k,i)=>S[k]=r[i].rows);render()}catch(x){}}
async function login(){try{if(!API){API=$('lapi').value.trim();localStorage.setItem('gp-api',API)}
  const j=await api('login',{user:$('lu').value.trim(),pass:$('lp').value});TOKEN=j.token;me=j.me;
  sessionStorage.setItem('gp-t',TOKEN);sessionStorage.setItem('gp-me',JSON.stringify(me));await go('scan')}
  catch(x){err=x.message==='bad'?'Wrong username or password.':x.message==='locked'?'Too many attempts. Try again in 15 minutes.':'Could not reach the backend. Check the URL and your connection.';render()}}
function logout(){stopCam();if(TOKEN)api('logout').catch(()=>{});TOKEN='';me=null;sessionStorage.clear();render()}

/* Scan */
function vScan(){return`<div class="card"><video id="v1" playsinline muted></video><canvas id="cv" hidden></canvas>
<div class="row"><button onclick="startCam()">Start camera</button><button class="g" onclick="stopCam()">Stop</button></div>
<div class="row"><input id="man" placeholder="Or type learner code / LRN"><button class="g" onclick="handle($('man').value)">Submit</button></div></div><div id="res"></div>`}
async function startCam(){
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('v1');v.srcObject=stream;await v.play();tick()}
  catch(x){$('res').innerHTML='<div class="card err">Camera unavailable here. Use the code box, or open the app on a device that allows camera access.</div>'}
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function tick(){
  if(!stream)return;const v=$('v1'),c=$('cv');
  if(v&&c&&v.readyState===4){c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0);
    const im=x.getImageData(0,0,c.width,c.height),r=window.jsQR&&jsQR(im.data,c.width,c.height);
    if(r&&r.data&&(r.data!==lastC||Date.now()-lastT>4000)){lastC=r.data;lastT=Date.now();handle(r.data)}}
  requestAnimationFrame(tick)
}
async function handle(raw){
  if(busy)return;busy=true;const res=$('res');
  try{const j=await api('scan',{code:String(raw).trim()}),l=j.learner;
    if(j.duplicate){res.innerHTML=`<div class="card">Just scanned: <b>${e(l.name)}</b> (${e(j.type)}).</div>`;return}
    res.innerHTML=`<div class="card"><span class="badge ${j.type}">${j.type}</span> <span class="big">${e(l.name)}</span><div class="mu">${e(l.grade)} · ${new Date(j.t).toLocaleString()}</div>
    <p>Parent message: ${e(j.sms)}</p>${me.role!=='gate'?`<div class="mu">${e(l.info||'No extra info yet.')}</div><div class="row"><button class="g" onclick="editL('${l.id}')">Edit info</button></div>`:''}</div>`;
    const m=$('man');if(m)m.value=''}
  catch(x){res.innerHTML=`<div class="card err">${x.message==='unknown'?'Unknown QR code.':'Scan failed. Check your connection.'}</div>`}
  finally{busy=false}
}

/* Learners */
function vLearners(){
  const L=S.learners.find(x=>x.id===editId)||{},list=S.learners.filter(l=>(l.name+l.lrn+l.grade).toLowerCase().includes(q.toLowerCase()));
  return`<div class="card"><b>${editId?'Edit learner':'Add learner'}</b><div class="grid">
  <div><label>Full name</label><input id="f1" value="${e(L.name)}"></div><div><label>LRN / ID number</label><input id="f2" value="${e(L.lrn)}"></div>
  <div><label>Grade &amp; section</label><input id="f3" value="${e(L.grade)}"></div><div><label>Parent / guardian</label><input id="f4" value="${e(L.pn)}"></div>
  <div><label>Parent mobile number</label><input id="f5" type="tel" value="${e(L.pp)}" placeholder="09xx xxx xxxx"></div></div>
  <label>Other information (allergies, pickup person, notes)</label><textarea id="f6" rows="2">${e(L.info)}</textarea>
  <div class="err">${e(err)}</div><div class="row"><button onclick="saveL()">${editId?'Save changes':'Create learner'}</button>${editId?'<button class="g" onclick="editId=null;render()">Cancel</button>':''}</div></div>
  <div class="card"><input placeholder="Search learners" value="${e(q)}" oninput="q=this.value;$('ll').innerHTML=rows()"><div class="tw" id="ll">${rows()}</div></div>`;
  function rows(){return list.length||q?`<table><tr><th>Name</th><th>Grade</th><th>Parent</th><th></th></tr>${S.learners.filter(l=>(l.name+l.lrn+l.grade).toLowerCase().includes(q.toLowerCase())).map(l=>`<tr><td>${e(l.name)}<div class="mu">${e(l.lrn)}</div></td><td>${e(l.grade)}</td><td>${e(l.pn)}<div class="mu">${e(l.pp)}</div></td><td><button class="g" onclick="showQR('${l.id}')">QR</button> <button class="g" onclick="editL('${l.id}')">Edit</button></td></tr>`).join('')}</table>`:'<p class="mu">No learners yet.</p>'}
}
async function editL(id){editId=id;tab='learners';stopCam();try{S.learners=(await api('list_learners')).rows}catch(x){}render();scrollTo(0,0)}
async function saveL(){
  const g=i=>$('f'+i).value.trim(),d={id:editId,name:g(1),lrn:g(2),grade:g(3),pn:g(4),pp:g(5),info:g(6)};
  if(!d.name||!d.pp){err='Name and parent mobile number are required.';render();return}
  try{await api('save_learner',{d});S.learners=(await api('list_learners')).rows;editId=null;err=''}
  catch(x){err=x.message==='dup'?'That LRN is already used.':'Could not save.'}render()}
function showQR(id){
  const l=S.learners.find(x=>x.id===id);$('qn').textContent=l.name;$('qc').textContent=l.grade;$('qr').innerHTML='';
  new QRCode($('qr'),{text:'GATEPASS:'+l.id,width:220,height:220});$('modal').style.display='flex'
}

/* Accounts */
function vAccounts(){
  const can=CREATE[me.role],vis=S.users.filter(u=>u.id!==me.id&&can.includes(u.role));
  return`<div class="card"><b>Create account</b><div class="grid"><div><label>Name</label><input id="a1"></div><div><label>Username</label><input id="a2"></div>
  <div><label>Password</label><input id="a3" type="text"></div><div><label>Role</label><select id="a4">${can.map(r=>`<option value="${r}">${RN[r]}</option>`).join('')}</select></div></div>
  <div class="err">${e(err)}</div><div class="row"><button onclick="addU()">Create</button></div></div>
  <div class="card"><b>Change my password</b><div class="row"><input id="np" placeholder="New password"><button class="g" onclick="chPw()">Update</button></div></div>
  <div class="card tw"><table><tr><th>Name</th><th>Username</th><th>Role</th><th></th></tr>${vis.map(u=>`<tr><td>${e(u.name)}</td><td>${e(u.user)}</td><td>${RN[u.role]}</td><td><button class="d" onclick="delU('${u.id}')">Remove</button></td></tr>`).join('')||'<tr><td colspan="4" class="mu">No accounts yet.</td></tr>'}</table></div>`
}
async function addU(){
  const g=i=>$('a'+i).value.trim(),d={name:g(1),user:g(2),pass:g(3),role:$('a4').value};
  if(!d.name||!d.user||d.pass.length<6){err='Fill all fields; password needs 6+ characters.';render();return}
  try{await api('save_user',{d});S.users=(await api('list_users')).rows;err=''}catch(x){err=x.message==='taken'?'Username taken.':'Not allowed.'}render()}
async function delU(id){if(!confirm('Remove this account?'))return;try{await api('delete_user',{id});S.users=S.users.filter(x=>x.id!==id)}catch(x){}render()}
async function chPw(){const p=$('np').value;if(p.length<6)return;try{await api('change_password',{pass:p});$('np').value='';alert('Password updated.')}catch(x){alert('Could not update.')}}

/* Logs & messages */
function vLogs(){
  const nm=id=>(S.learners.find(l=>l.id===id)||{name:'(deleted)'}).name;
  return`<div class="card tw"><table><tr><th>Time</th><th>Learner</th><th>Status</th><th>Scanned by</th></tr>${[...S.logs].reverse().slice(0,300).map(x=>`<tr><td>${new Date(x.t).toLocaleString()}</td><td>${e(nm(x.lid))}</td><td><span class="badge ${x.type}">${x.type}</span></td><td>${e(x.by)}</td></tr>`).join('')||'<tr><td colspan="4" class="mu">No scans yet.</td></tr>'}</table></div>`
}
function vMsgs(){
  return`<div class="card tw"><p class="mu">Every scan is recorded here with its delivery status. Send SMS opens your phone\u2019s messaging app as a manual fallback.</p><table><tr><th>Time</th><th>To</th><th>Message</th><th></th></tr>${[...S.msgs].reverse().slice(0,200).map(m=>`<tr><td>${new Date(m.t).toLocaleString()}</td><td>${e(m.parent)}<div class="mu">${e(m.to)}</div></td><td>${e(m.body)}<div class="mu">${e(m.status)}</div></td><td><a class="btn g" style="background:transparent;color:var(--pr)" href="sms:${encodeURIComponent(m.to)}?body=${encodeURIComponent(m.body)}">Send SMS</a></td></tr>`).join('')||'<tr><td colspan="4" class="mu">No messages yet.</td></tr>'}</table></div>`
}
try{const m=sessionStorage.getItem('gp-me');if(TOKEN&&m)me=JSON.parse(m)}catch(x){}
render();
</script></body></html>
